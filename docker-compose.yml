version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: interview_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: supersecretpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: interview_redis
    ports:
      - "6379:6379"

volumes:
  mongo_data: